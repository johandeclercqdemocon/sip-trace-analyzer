[project]
name = "sip-trace-analyzer"
version = "1.0.0"
description = "Deterministic SIP trace analysis with an RFC-cited knowledge base"
requires-python = ">=3.11"

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = [".venv", "web", "rfc", "iana"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI depends on callables in argument defaults
    "SIM108",  # a ternary is not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path is adjusted before importing the package
"api/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:scapy.*"]
